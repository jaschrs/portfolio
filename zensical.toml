[project]
# TODO: set to your real domain before deploying.
site_url = "https://example.com/"
site_name = "Jasper Christian"
site_description = "Software engineer and CS student. Projects, docs and writing."
site_author = "Jasper Christian"
copyright = "Copyright &copy; 2026 Jasper Christian"
repo_url = "https://github.com/jaschrs"
repo_name = "jaschrs"

# Each project lives at its own root path (docs/<slug>/ -> /<slug>/).
# To add one: create docs/<slug>/index.md, add it here and to projects.md.
nav = [
  { "Home" = "index.md" },
  { "Experience" = "experience.md" },
  { "Projects" = [
    "projects.md",
    { "Kestrel" = "kestrel/index.md" },
    { "Relay" = "relay/index.md" },
    { "Lexa" = "lexa/index.md" },
    { "Sightline" = "sightline/index.md" },
    { "dotctl" = "dotctl/index.md" },
    { "CoursePlan" = "courseplan/index.md" },
  ] },
  { "Blog" = "blog/index.md" },
  { "Contact" = "contact.md" },
]

# Vercel Web Analytics; served by Vercel once Analytics is enabled for the project.
extra_javascript = [{ path = "/_vercel/insights/script.js", defer = true }]

[project.theme]
language = "en"
favicon = "assets/logo.png"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.theme.icon]
logo = "lucide/terminal"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/jaschrs"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/your-handle"

[[project.extra.social]]
icon = "fontawesome/solid/envelope"
link = "mailto:hello@example.com"

[project.plugins.blog]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
